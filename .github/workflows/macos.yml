name: macOS verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified upstream
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check credentials and action pins
        run: python3 scripts/security_check.py --history
      - run: zsh Tests/run.sh
      - run: zsh build.sh --build-only
      - run: zsh Tests/install-migration.sh

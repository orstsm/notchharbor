name: Publish community release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: community-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'orstsm/notchharbor'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified upstream
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check credentials and action pins
        run: python3 scripts/security_check.py --history
      - name: Validate version and release notes
        run: zsh package-community.sh "$GITHUB_REF_NAME" --validate-only
      - name: Run regression tests
        run: zsh Tests/run.sh
      - name: Build and verify universal community app
        run: zsh package-community.sh "$GITHUB_REF_NAME"
      - name: Verify rename and installation migration
        run: zsh Tests/install-migration.sh
      - name: Publish download and installation instructions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # No overwrite/clobber: an existing release fails safely on reruns.
          # gh uploads assets to a draft before publishing the complete release.
          gh release create "$GITHUB_REF_NAME" \
            "dist/NotchHarbor-$version-universal-community.zip" \
            dist/INSTALL.md dist/SHA256SUMS.txt \
            --verify-tag \
            --title "NotchHarbor $version — community build" \
            --notes-file dist/community-release-notes.md
